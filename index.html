<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Вопрос 💖</title>

<style>
  body {
    font-family: Arial, sans-serif;
    text-align: center;
    background: #ffe6f0;
    margin: 0;
    height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
  }

  h1 {
    margin-bottom: 40px;
  }

  #area {
    position: relative;
    width: 400px;
    height: 200px;
  }

  button {
    padding: 15px 30px;
    font-size: 20px;
    cursor: pointer;
    position: absolute;
  }

  #yes {
    background: #4CAF50;
    color: white;
    left: 60px;
    top: 70px;
    z-index: 1;
  }

  #no {
    background: #f44336;
    color: white;
    left: 220px;
    top: 70px;
  }
</style>
</head>

<body>

<h1>Андрей, ты пидор? 💖</h1>

<div id="area">
  <button id="yes" onclick="yes()">ДА</button>
  <button id="no" onclick="moveNo()">НЕТ</button>
</div>

<script>
let scale = 1;

function moveNo() {
  const no = document.getElementById("no");
  const area = document.getElementById("area");

  const maxX = area.clientWidth - no.offsetWidth;
  const maxY = area.clientHeight - no.offsetHeight;

  const x = Math.random() * maxX;
  const y = Math.random() * maxY;

  no.style.left = x + "px";
  no.style.top = y + "px";

  scale += 0.15;
  document.getElementById("yes").style.transform = `scale(${scale})`;
}

function yes() {
  document.body.innerHTML = "<h1>УРАААА!!! 💘💍</h1>";
}
</script>

</body>
</html>
